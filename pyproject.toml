[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tap"
version = "0.3.2"
description = "Local usage analytics, error debugging, trace correlation, and service monitoring for Claude Code, Codex, Copilot CLI, Aider, Cline, LiteLLM, Ollama, SearXNG, Firecrawl, and local AI services"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["ai-agents", "coding-agents", "claude-code", "openai-codex", "github-copilot", "copilot-cli", "aider", "cline", "litellm", "ollama", "mcp", "model-context-protocol", "llm-observability", "agent-observability", "agent-monitoring", "agent-debugging", "llmops", "sqlite", "developer-tools", "opentelemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["platformdirs>=3.0", "fastapi>=0.100", "uvicorn>=0.23"]

[project.urls]
Homepage = "https://github.com/nareshh74/agent-tap"
Source = "https://github.com/nareshh74/agent-tap"
Issues = "https://github.com/nareshh74/agent-tap/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.24", "build", "twine"]

[project.scripts]
agent-tap = "agent_tap.cli:main"

[project.entry-points."agent_tap.harnesses"]
raven = "agent_tap.adapters.raven:RavenAdapter"
hermes = "agent_tap.adapters.hermes:HermesAdapter"
claude-code = "agent_tap.adapters.claude_code:ClaudeCodeAdapter"
codex = "agent_tap.adapters.codex:CodexAdapter"
copilot-cli = "agent_tap.adapters.copilot_cli:CopilotCliAdapter"
omniroute = "agent_tap.adapters.omniroute:OmniRouteAdapter"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_tap = ["dashboard/static/*", "examples/*.toml", "examples/services/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
